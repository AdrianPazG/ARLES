[package]
name = "arles-app"
description = "Shell de escritorio de ARLES RELAY: comandos Tauri, estado y arranque."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
# Tauri 2 exige el crate como librería para poder construir también para móvil,
# aunque v1.2.0 no tenga objetivos móviles (§4).
name = "arles_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arles-core = { path = "../arles-core" }
arles-db = { path = "../arles-db" }
arles-import = { path = "../arles-import" }
tauri = { version = "2", features = [] }
# Sólo se usa desde Rust, NUNCA se le da el permiso a la webview. Ver la nota
# en comandos.rs sobre por qué la ruta del archivo no cruza la frontera.
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json = "1"
thiserror.workspace = true
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
] }
directories = "6"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

# Solo para el cuadro de diálogo del fallo de arranque: con
# `windows_subsystem = "windows"` el stderr no va a ninguna parte, y la
# aplicación moriría en silencio. Ver `mostrar_fallo_de_arranque`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
