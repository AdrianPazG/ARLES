[package]
name = "arles-db"
description = "Acceso a datos de ARLES RELAY: SQLCipher, migraciones y repositorios."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
arles-core = { path = "../arles-core" }
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
refinery = { version = "0.9", features = ["rusqlite"] }
getrandom = "0.3"
thiserror.workspace = true
time.workspace = true

[features]
# Expone un escape a SQL crudo para tests de otros crates. Nunca en producción.
test-util = []

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
